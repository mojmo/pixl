services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    networks:
      - app-network
#    volumes:
#       - ./backend/target/ROOT.war:/usr/local/tomcat/webapps/ROOT.war
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    networks:
      - app-network
#    volumes:
#       - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend

  db:
    image: mysql:8
    networks:
      - app-network
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"

volumes:
  db_data:

networks:
  app-network:
    driver: bridge